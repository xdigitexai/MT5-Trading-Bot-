[project]
name = "forex-mt5-bot"
version = "0.1.0"
description = "Fail-closed MT5 Forex trading system"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5.2,<6", "pandas>=2.2,<3", "numpy>=2.1,<3", "scikit-learn>=1.5,<2",
  "httpx>=0.27,<1", "python-jose[cryptography]>=3.3,<4", "slowapi>=0.1.9,<1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

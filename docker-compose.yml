services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forexbot
      POSTGRES_USER: forex
      POSTGRES_PASSWORD: forex
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex -d forexbot"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    profiles: ["api"]
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # MT5's Windows terminal/API must run on a Windows host; do not use this Linux container for execution.
volumes:
  postgres_data:

; MT5 start configuration file (documented: "Platform Start - For Advanced Users").
; Launch: terminal64.exe /config:"<this file>"
; The [StartUp] section attaches XdigitexCalendarBridge to the first chart of the "Default"
; profile, which is the EURUSDm M1 chart this deployment keeps open, so the terminal starts the
; calendar bridge by itself with no click, no Navigator and no GUI interaction.
; Note the file is read as "read only": settings changed in the platform UI are not written here.

[Common]
Login=134693538
Server=ExnessKE-MT5Real9
ProxyEnable=0
NewsEnable=1

[Charts]
ProfileLast=Default
MaxBars=100000
TradeHistory=1
TradeLevels=1

[Experts]
AllowLiveTrading=1
AllowDllImport=0
Enabled=1
Account=0
Profile=0

[StartUp]
Expert=XdigitexCalendarBridge
Period=M1
